name: Build Windows app

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore packages
        run: dotnet restore "KiotViet Label Printer Pro V2.csproj"

      - name: Build
        run: dotnet build "KiotViet Label Printer Pro V2.csproj" --configuration Release --no-restore

      - name: Publish portable folder
        run: >
          dotnet publish "KiotViet Label Printer Pro V2.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create portable zip
        shell: powershell
        run: Compress-Archive -Path "publish\*" -DestinationPath "KiotViet-Printer-Better-win-x64.zip"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer.iss"'

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: KiotViet-Printer-Better-win-x64
          path: KiotViet-Printer-Better-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KiotViet-Printer-Better-Setup
          path: installer_output/KiotViet-Printer-Better-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            KiotViet-Printer-Better-win-x64.zip
            installer_output/KiotViet-Printer-Better-Setup.exe
